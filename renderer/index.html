<!DOCTYPE html>
<html lang="fr" class="dashboard-window">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https: http:; img-src 'self' data: https:;">
  <title>Matin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <!-- Bootstrap thème (2026-08-08) — voir config.html pour l'explication
       complète (même mécanisme dans les 2 documents) : synchrone, pose
       :root[data-color-scheme] AVANT le premier rendu à partir de
       window.matin.initialTheme (lu de façon synchrone côté preload.js). -->
  <script>document.documentElement.dataset.colorScheme = window.matin.initialTheme;</script>
</head>
<body>
  <!-- Fond personnalisé (2026-08-11, sur demande explicite — voir
       "🎨 Personnaliser" dans Paramètres, config.js/dashboard.js
       applyAppBackground) — 1er enfant de body pour peindre SOUS tout le
       reste (titlebar/dashboard n'ont pas besoin de z-index pour passer
       devant, l'ordre du DOM suffit), `pointer-events:none` pour ne jamais
       intercepter clics/glisser-déposer. Vide/transparent tant qu'aucun
       fond n'est sélectionné (app.background === 'none'). -->
  <div class="app-background-layer" id="appBackgroundLayer"></div>

  <!-- Overlay de démarrage / rafraîchissement — soleil qui se lève, voir
       style.css (.splash-*) et dashboard.js (playSplashAnimation,
       revealModuleCards). Couvre TOUTE la fenêtre (position:fixed, au-dessus
       du titlebar) — rejoué à l'identique à chaque `location.reload()`
       (bouton Actualiser), puisqu'il fait partie du HTML statique. -->
  <div class="splash-overlay" id="splashOverlay">
    <!-- Taille réelle pilotée par CSS (70vw × 70vw, voir style.css) — pas de
         width/height fixes ici, le viewBox suffit à définir le système de
         coordonnées interne (rayons, dégradé) indépendamment de la taille
         de rendu. -->
    <svg class="splash-sun-wrap" viewBox="0 0 200 200" aria-hidden="true">
      <!-- 16 rayons "allongés" en triangles (pas des lignes fines) — base
           volontairement À L'INTÉRIEUR du disque (y=75, disque de rayon 42
           centré en 100,100 donc bord haut à y=58) pour que le disque,
           dessiné APRÈS (donc par-dessus), cache proprement leur base et ne
           laisse dépasser que la pointe. Tournent ensemble via
           .splash-rays (voir style.css, 1 tour/8s). -->
      <g class="splash-rays">
        <polygon points="100,4 94,75 106,75" transform="rotate(0 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(22.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(45 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(67.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(90 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(112.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(135 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(157.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(180 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(202.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(225 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(247.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(270 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(292.5 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(315 100 100)"/>
        <polygon points="100,4 94,75 106,75" transform="rotate(337.5 100 100)"/>
      </g>
      <circle class="splash-sun" cx="100" cy="100" r="42" fill="#fbbf24"/>
    </svg>
  </div>

  <!-- Mode auto luminosité — SUPPRIMÉ ENTIÈREMENT le 2026-08-31, sur demande
       explicite (voir CONTEXT.md) : ce calque .brightness-overlay n'a plus
       d'usage, retiré. -->

  <!-- Barre de titre custom -->
  <header class="titlebar">
    <div class="titlebar-left">
      <span class="app-logo">☀️</span>
      <span class="app-name">Matin</span>
      <span class="app-date" id="headerDate"></span>
      <!-- Déplacée depuis .titlebar-center (2026-08-10, sur demande explicite,
           2e révision) : juste après la date, à gauche, PAS centrée entre la
           date et la barre de recherche — voir .app-greeting dans style.css
           pour le petit espace supplémentaire (16px) qui la sépare de la date. -->
      <span class="app-greeting" id="headerGreeting"></span>
      <!-- Sync Google Drive (2026-08-21, voir main.js performDriveLaunchSync,
           dashboard.js initDriveSyncIndicator) — vide/invisible par défaut,
           affiché 3s par JS après une synchronisation réussie au lancement. -->
      <span class="drive-sync-indicator" id="driveSyncIndicator"></span>
    </div>
    <div class="titlebar-center">
      <!-- Réduire en icône flottante (2026-08-23, déplacée le même jour à
           gauche de la barre de recherche sur demande explicite — vivait
           avant dans .titlebar-right, à côté de Paramètres) — masquée par
           défaut, affichée par dashboard.js (initDisplayMode) UNIQUEMENT en
           mode "floating" ; Échap fait la même chose (voir dashboard.js).
           "☀️→🔆" (grand soleil → petit soleil) illustre "réduire en icône" ;
           .titlebar-collapse-btn (voir style.css) porte le gap de 40px vers
           la barre de recherche et la largeur minimale de 60px. -->
      <button class="titlebar-btn titlebar-collapse-btn" id="btnCollapseToSun" title="Réduire en icône flottante" style="display:none">☀️→🔆</button>
      <form class="titlebar-search" id="titlebarSearch">
        <button type="submit" class="titlebar-search-icon" title="Rechercher sur Google">🔍</button>
        <input type="text" id="titlebarSearchInput" placeholder="Rechercher sur Google..." autocomplete="off">
      </form>
    </div>
    <div class="titlebar-right">
      <button class="titlebar-btn" id="btnRefresh" title="Actualiser">Actualiser</button>
      <button class="titlebar-btn" id="btnAutoArrange" title="Réorganiser automatiquement les modules par catégorie">⊞ Réorganiser</button>
      <!-- Sélecteur de profil (2026-08-31, sur demande explicite ; icône
           👤→🚪, 2e révision, même jour, sur demande explicite) — bascule
           INSTANTANÉMENT entre Profil 1/2 (voir dashboard.js
           initProfileSwitcher, main.js profiles:switch). Libellé peuplé au
           chargement avec le nom du profil ACTIF (ex. "🚪 Semaine") — jamais
           "Profil 1"/"Profil 2" en dur, ces clés ne sont que des identifiants
           internes. -->
      <button class="titlebar-btn" id="btnProfileSwitch" title="Changer de profil">🚪 …</button>
      <button class="titlebar-btn" id="btnConfig" title="Paramètres">Paramètres</button>
    </div>
  </header>

  <!-- Volet latéral (2026-08-23, sur demande explicite) — bande de 12px,
       visible/active UNIQUEMENT en mode "sidebar" (voir style.css,
       body.display-mode-sidebar .sidebar-strip, et dashboard.js
       initDisplayMode pour le survol/clic). Position `left`/`right` posée
       dynamiquement selon app.sidebarEdge — voir le commentaire détaillé sur
       enterSidebarMode/sidebarExpandedX dans main.js pour la géométrie
       (contre-intuitif : le bord "right" affiche sa bande à `left:0`). -->
  <div class="sidebar-strip" id="sidebarStrip"><span class="sidebar-strip-sun">☀️</span></div>

  <!-- Popup de confirmation "⊞ Réorganiser" (2026-08-10, 2e révision, sur
       demande explicite) — boutons libellés custom demandés ("Oui,
       réorganiser"/"Annuler"), impossible avec un confirm() natif (labels
       fixes, non personnalisables), d'où cette popup HTML maison. Masquée
       par défaut, `.open` l'affiche (voir style.css, même mécanisme que la
       popup Sauvegardes de Paramètres). Complétée le 2026-08-31 (sur demande
       explicite) avec 2 emplacements de disposition sauvegardés manuellement
       (Sauvegarder/Charger disposition 1 et 2), voir dashboard.js
       loadLayoutSlot/saveLayoutSlot. -->
  <div class="autoarrange-confirm-overlay" id="autoArrangeConfirmOverlay">
    <div class="autoarrange-confirm-modal">
      <p class="autoarrange-confirm-text">Voulez-vous réorganiser automatiquement vos modules ?</p>
      <div class="autoarrange-confirm-actions">
        <button type="button" class="autoarrange-confirm-btn autoarrange-confirm-btn-primary" id="autoArrangeConfirmOk">Oui, réorganiser</button>
        <button type="button" class="autoarrange-confirm-btn" id="autoArrangeConfirmCancel">Annuler</button>
      </div>

      <!-- Emplacements de disposition sauvegardés (2026-08-31, sur demande
           explicite ; noms personnalisés ajoutés le même jour, 2e révision,
           toujours sur demande explicite) — 2 emplacements fixes, stockés
           dans matin-userdata (voir main.js layoutSlots:get/save,
           synchronisé automatiquement via Drive comme le reste de
           userdata). "Charger" reste désactivé tant que l'emplacement
           correspondant n'a jamais été sauvegardé, et porte le nom
           personnalisé + la date une fois sauvegardé, ex. "📂 Charger :
           Sport — sauvegardée le 30 août" (voir dashboard.js
           refreshLayoutSlotsUI) — plus de libellé générique "Disposition 1"
           une fois qu'un nom a été choisi. -->
      <div class="layout-slots-section">
        <div class="layout-slot-row" data-slot="1">
          <div class="layout-slot-actions">
            <button type="button" class="autoarrange-confirm-btn layout-slot-btn" id="layoutSlotSave1">💾 Sauvegarder disposition 1</button>
            <button type="button" class="autoarrange-confirm-btn layout-slot-btn" id="layoutSlotLoad1" disabled>📂 Charger disposition 1</button>
          </div>
        </div>
        <div class="layout-slot-row" data-slot="2">
          <div class="layout-slot-actions">
            <button type="button" class="autoarrange-confirm-btn layout-slot-btn" id="layoutSlotSave2">💾 Sauvegarder disposition 2</button>
            <button type="button" class="autoarrange-confirm-btn layout-slot-btn" id="layoutSlotLoad2" disabled>📂 Charger disposition 2</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Nom de la disposition à sauvegarder (2026-08-31, sur demande
       explicite) — s'ouvre au clic sur "💾 Sauvegarder disposition 1/2",
       PRÉ-REMPLIE avec le nom déjà sauvegardé sur cet emplacement s'il y en
       a un (voir dashboard.js requestSaveLayoutSlot), vide sinon. Ne
       sauvegarde QUE sur "💾 Enregistrer" — "Annuler"/clic hors modale/Échap
       ferment sans rien écrire. Même mécanisme .open que la popup
       "⊞ Réorganiser" ci-dessus, empilée par-dessus elle (voir style.css,
       z-index supérieur). -->
  <div class="autoarrange-confirm-overlay layout-slot-name-overlay" id="layoutSlotNameOverlay">
    <div class="autoarrange-confirm-modal">
      <p class="autoarrange-confirm-text">Nom de la disposition</p>
      <input type="text" class="layout-slot-name-input" id="layoutSlotNameInput" placeholder="ex : Sport, Finance, Matin complet" maxlength="40">
      <div class="autoarrange-confirm-actions">
        <button type="button" class="autoarrange-confirm-btn autoarrange-confirm-btn-primary" id="layoutSlotNameConfirm">💾 Enregistrer</button>
        <button type="button" class="autoarrange-confirm-btn" id="layoutSlotNameCancel">Annuler</button>
      </div>
    </div>
  </div>

  <!-- Notice "Réorganiser" (2026-08-10, 2e révision) — toast bref (2s), voir
       dashboard.js performAutoArrange/applyAutoArrangeLayouts. Masqué par
       défaut (opacity:0, voir style.css), `.show` l'affiche/le fait
       disparaître en fondu (transition CSS), jamais un display:none brutal.
       Le bouton "Annuler" restaure la disposition juste précédente
       (lastAutoArrangeSnapshot côté dashboard.js) tant que la notice est
       visible. -->
  <div class="autoarrange-notice" id="autoArrangeNotice">
    <span id="autoArrangeNoticeText">✓ Nouvelle disposition appliquée</span>
    <button type="button" class="autoarrange-notice-undo" id="autoArrangeUndo">Annuler</button>
  </div>

  <!-- Bandeau Alertes (2026-08-08, sur demande explicite) — au-dessus de
       TOUTES les cartes, jamais un module carte comme les autres (voir
       dashboard.js, initAlertsBanner/renderAlertsBanner ; le check lui-même
       tourne côté process main, voir main.js checkAlerts). Vide/caché tant
       qu'aucune alerte active ; `.dashboard` voit son `top` repoussé
       dynamiquement en JS pour ne jamais laisser une carte sous le bandeau. -->
  <div class="alerts-banner" id="alertsBanner"></div>

  <!-- Bandeau "Données manquantes" (2026-08-30, sur demande explicite, suite
       à l'incident de perte de données ETF/Crypto/Prêts) — voir
       dashboard.js initMissingDataWarning/main.js IPC userdata:isEmpty.
       Vérifié en LIVE (pas un flag figé au lancement), donc peut apparaître
       ET disparaître au cours d'une même session si une restauration
       aboutit après le premier rendu (auto/Drive/manuelle). -->
  <div class="missing-data-banner" id="missingDataBanner">
    <span>⚠️ Données manquantes — vos ETF, Crypto, Prêts (ou autres) semblent vides.</span>
    <button type="button" class="missing-data-banner-btn" id="missingDataBannerBtn">Ouvrir Sauvegardes</button>
  </div>

  <!-- Zone de modules : #dashboard est la fenêtre de défilement (taille fixe,
       calée sur le viewport) ; #dashboardCanvas est le calque interne qui
       grandit pour accueillir des modules déplacés loin en bas — un élément
       position:fixed avec top ET bottom définis ignore toute min-height
       qu'on lui appliquerait directement, d'où ce calque séparé. -->
  <main class="dashboard" id="dashboard">
    <div class="dashboard-canvas" id="dashboardCanvas">
      <!-- Les modules sont injectés dynamiquement par dashboard.js — plus de
           placeholder "Chargement du dashboard…" ici (retiré le 2026-08-06) :
           l'overlay plein écran ci-dessus couvre désormais tout le temps de
           chargement initial. -->
    </div>
  </main>

  <script src="../node_modules/interactjs/dist/interact.min.js"></script>

  <script src="modules/air-quality.js"></script>
  <script src="modules/hue.js"></script>

  <script src="modules/tradfri.js"></script>
  <script src="modules/fuel-prices.js"></script>

  <script src="dashboard.js"></script>
</body>
</html>
