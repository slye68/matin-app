<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Matin</title>
  <style>
    /* Fenêtre sans cadre/transparente, dimensionnée par main.js
       (showStripWindow/computeStripBounds) à 20px de large sur toute la
       hauteur de la zone de travail de l'écran — html/body doivent rester
       transparents aussi, sinon le rectangle de la fenêtre serait visible
       tout du long, pas seulement la bande colorée elle-même. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .strip-handle {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #4f8ef7 0%, #a78bfa 100%);
      cursor: pointer;
      user-select: none;
      /* Pas de -webkit-app-region: drag (même raison que sun.html) : cette
         fenêtre n'est de toute façon pas déplaçable (movable:false côté
         main.js, position imposée par l'écran/le bord choisi), mais
         app-region:drag peut aussi absorber le clic lui-même côté Chromium —
         évité par précaution, comme pour le soleil flottant. */
      -webkit-app-region: no-drag;
    }
    .strip-arrow {
      color: #fff;
      font-size: 11px;
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
    }
  </style>
</head>
<body>
  <div class="strip-handle" id="stripHandle"><span class="strip-arrow" id="stripArrow">◀</span></div>
  <script src="strip.js"></script>
</body>
</html>
