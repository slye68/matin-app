<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Icône Matin!* (2026-08-11, sur demande explicite) — soleil doré cerné de
    12 rayons triangulaires verts, séparés par un anneau blanc, sur fond
    sombre arrondi. Généré à la main (voir gen-icon.js, exécuté une fois via
    Electron/Chromium pour rastériser en icon.png/icon.ico — pas de nouvelle
    dépendance npm, réutilise le moteur déjà présent dans le projet).
  -->
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="#0f1117"/>
  <!-- Anneau blanc — visible entre le bord du disque (r=130) et la base des
       rayons (r=152), 22px de large. -->
  <circle cx="256" cy="256" r="150" fill="#ffffff"/>
  <g fill="#34d399">
    <polygon points="256.0,31.0 245.0,104.0 267.0,104.0"/>
    <polygon points="368.5,61.1 322.5,118.9 341.5,129.9"/>
    <polygon points="450.9,143.5 382.1,170.5 393.1,189.5"/>
    <polygon points="481.0,256.0 408.0,245.0 408.0,267.0"/>
    <polygon points="450.9,368.5 393.1,322.5 382.1,341.5"/>
    <polygon points="368.5,450.9 341.5,382.1 322.5,393.1"/>
    <polygon points="256.0,481.0 267.0,408.0 245.0,408.0"/>
    <polygon points="143.5,450.9 189.5,393.1 170.5,382.1"/>
    <polygon points="61.1,368.5 129.9,341.5 118.9,322.5"/>
    <polygon points="31.0,256.0 104.0,267.0 104.0,245.0"/>
    <polygon points="61.1,143.5 118.9,189.5 129.9,170.5"/>
    <polygon points="143.5,61.1 170.5,129.9 189.5,118.9"/>
  </g>
  <circle cx="256" cy="256" r="130" fill="#FFC107"/>
</svg>
